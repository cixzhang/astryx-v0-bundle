name: Live v0 import

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    name: Anonymous import probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm v0:verify-import
      - name: Upload import evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-import-evidence
          path: v0-import-evidence
          if-no-files-found: error
          retention-days: 14
